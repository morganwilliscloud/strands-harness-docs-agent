[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-harness-docs-agent"
version = "0.1.0"
description = "A tutorial documentation agent built with the Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "strands-agents[openai]>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
docs-agent = "docs_agent.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
