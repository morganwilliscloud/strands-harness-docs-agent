name: Update documentation
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'test/**'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full ancestor commit SHA to compare against the current main branch
        required: false
        type: string
      pr_number:
        description: Existing docs PR to revise instead of starting a new task
        required: false
        type: string
      feedback:
        description: Revision instructions for pr_number
        required: false
        type: string
permissions: {}
concurrency:
  group: docs-agent
  cancel-in-progress: false
jobs:
  investigate:
    if: >-
      vars.DOCS_AGENT_ENABLED == 'true' &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '@docs-bot revise')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      pr_number: ${{ steps.session.outputs.DOCS_PR_NUMBER }}
      pr_head: ${{ steps.session.outputs.DOCS_PR_HEAD }}
      pr_branch: ${{ steps.session.outputs.DOCS_PR_BRANCH }}
    env:
      BASE_SHA: ${{ github.event.before || inputs.base_sha }}
      HEAD_SHA: ${{ github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check reader configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          test -n "$AWS_REGION" || { echo "::error::Set the AWS_REGION repository variable."; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "::error::Set the AWS_ROLE_ARN repository variable."; exit 1; }
          test -n "$AWS_ACCOUNT_ID" || { echo "::error::Set the AWS_ACCOUNT_ID repository variable."; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare task and restore the PR session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docs-session.mjs prepare
      - name: Restore shared long-term memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docs-memory.mjs restore
      - name: Read new maintainer feedback from documentation PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docs-memory.mjs feedback
      - name: Configure short-lived Bedrock access
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 1800
      - name: Investigate and update documentation
        run: npm run agent:docs
      - name: Independently validate and prepare Markdown patch
        id: patch
        run: npm run docs:patch
      - name: Save the conversation for the next PR revision
        run: node scripts/docs-session.mjs save
      - name: Persist PR conversation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-session-${{ env.DOCS_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-output/session-snapshot/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Prepare memory for the next run
        run: node scripts/docs-memory.mjs save
      - name: Persist shared long-term memory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-output/memory-snapshot/
          retention-days: 90
          if-no-files-found: error
      - name: Save diagnostic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-run-${{ github.sha }}
          path: |
            run-output/agent-summary.md
            run-output/test.txt
            run-output/docs-check.txt
            run-output/changed-files.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore
      - name: Pass only the reviewed patch to publishing
        if: steps.patch.outputs.changed == 'true' || steps.session.outputs.DOCS_PR_NUMBER != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-patch-${{ github.sha }}
          path: |
            run-output/docs.patch
            run-output/pr-body.md
          retention-days: 7
  publish:
    needs: investigate
    if: needs.investigate.outputs.changed == 'true' || needs.investigate.outputs.pr_number != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-patch-${{ github.sha }}
          path: docs-output
      - name: Open the documentation PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          DOCS_PR_NUMBER: ${{ needs.investigate.outputs.pr_number }}
          DOCS_PR_HEAD: ${{ needs.investigate.outputs.pr_head }}
          DOCS_PR_BRANCH: ${{ needs.investigate.outputs.pr_branch }}
        run: node scripts/publish-docs-pr.mjs
